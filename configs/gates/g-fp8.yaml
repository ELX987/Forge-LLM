# G-FP8 - FP8 W8A8 and FP8 KV cache (Plan 10.1). TARGET thresholds, recalibrated at Gate G1.
gate: G-FP8-v1
status: TARGET
title: FP8 weights/activations and FP8 KV
description: "KL p99 <= 0.01, flip rate <= 1%, task suite non-inferior at delta = 0.5 pt, long-context >= 99% of parent."
