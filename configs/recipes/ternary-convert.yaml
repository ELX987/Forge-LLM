# ternary-convert (recipe) -- EXPERIMENTAL: convert a pretrained bf16 model to ternary {-1,0,+1} with QAT + distillation recovery.
# Route (tern158 report, Ch. 7; all numbers there are literature claims, NOT reproduced in Forge):
#   1. `distill` (delegate) trains the model with ternary QAT (precision.quant_aware: ternary, warm-up blend over ~500 steps) while
#      distilling from the frozen original (teacher = the recipe's input model; KD alpha ~0.5, temperature 1). lr ~5e-5, weight decay 0.
#   2. `ternarize` packs the QAT-trained weights into t158 layers (exact w.r.t. the QAT forward), `pack` validates the layout,
#      `gate` checks G-T158 (TARGET placeholders).
# Fill `config.data` (dataset ids from the dataset_ingest job) and `config.model.tokenizer`; budget tens of millions to billions of tokens
# for real conversions (tern158: 1-10B tokens recover commonsense, not knowledge). Not validated on hardware: emulated fake-quant, no speed-up.
recipe: ternary-convert
inputs:
  calib: builtin-mix
stages:
  - distill:
      mode: delegate
      licence_check: true
      config:
        data: {dataset: ["my-corpus"], seq_len: 2048}
        optim: {lr: 0.00005, weight_decay: 0.0, grad_clip: 1.0}
        precision:
          quant_aware: ternary
          exempt_first_layers: 0
          exempt_last_layers: 0
          diagnostics_every: 10
          loss_gap_every: 100
          ternary: {group_size: 128, rule: lloyd, warmup_steps: 500}
        budget: {max_steps: 2000}
  - ternarize: {group_size: 128, rule: lloyd, iters: 1}
  - pack: {layout: auto, target: null}
  - gate: {suite: g-t158, seeds: 3, stats: bootstrap_2000, suites: [distribution, mcq]}
baselines: [fp8_w8a8]
budget: {gpu_hours: 50, max_wall_hours: 48}
policy: {licence_check: true}
seeds: [0]
