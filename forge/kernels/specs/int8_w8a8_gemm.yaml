# Plan 6.4 K3 (INT8 branch): SmoothQuant-style W8A8 for chips with INT8 but no FP8 units.
kernel: int8_w8a8_gemm
family: gemm
op: "Y[M,N] = (Xq[M,K] @ Wq[N,K]^T)_int32 * sx[M] * sw[N] + bias"
description: INT8 x INT8 -> INT32 GEMM with per-token activation and per-channel weight scales applied in the epilogue.
dtypes: {x: int8, w: int8, scale: fp32, acc: int32, y: bf16}
compute_dtype: int8
quant:
  weight_bits: 8
  group: [-1]
  zero_point: none
  scale_apply: epilogue
  act_scaling: per_token
  weight_scaling: per_channel
shape_hints: {M: [1, 16, 128, 1024, 4096], N: model_native, K: model_native}
search:
  tile_m: [16, 32, 64, 128]
  tile_n: [64, 128, 256]
  tile_k: [64, 128]
  stages: [3, 4]
  warps: [4, 8]
  split_k: [1]
fusion: {prologue: [rmsnorm_absmax_quant], epilogue: [bias]}
layout: {weights: row_major, scales: fp32_vectors, align_bytes: 16}
oracle: ref.int8_gemm_ref
tolerance: {rel: 2.0e-3, abs: 1.0e-3, rel_norm: 2.0e-2, bitexact_int_paths: true}
kpi: {tflops_fraction_min: 0.9, at_M: [4096]}
min_sm: 75
notes:
  - "Triton int8 tl.dot path: interpreter-checked only, not GPU validated."
